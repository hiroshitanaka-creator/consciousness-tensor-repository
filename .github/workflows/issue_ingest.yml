name: Issue Ingestion

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to register as a snapshot"
        required: true
        type: number

permissions:
  contents: write
  issues: read
  pull-requests: write

# Different revisions have separate branches; retries of one revision serialize.
concurrency:
  group: issue-ingest-${{ github.event.issue.number || inputs.issue_number }}-${{ github.event.issue.updated_at || 'snapshot' }}-${{ github.event.action || 'manual' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch manually requested Issue
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/ctr-issue.json"

      - name: Register ExperienceEvent
        id: experience
        env:
          EVENT_KIND: ${{ github.event_name }}
        run: |
          if [ "$EVENT_KIND" = "workflow_dispatch" ]; then
            python kernel/experience_event.py --issue-file "$RUNNER_TEMP/ctr-issue.json" --repository "$GITHUB_REPOSITORY"
          else
            python kernel/experience_event.py --event-file "$GITHUB_EVENT_PATH"
          fi

      - name: Validate tests and all five axes
        run: |
          python -m unittest
          python kernel/tensor_gate.py --all --enforce

      - name: Preserve ingestion artifacts
        if: always() && steps.experience.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ctr-experience-${{ steps.experience.outputs.issue_number }}-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ steps.experience.outputs.path }}
            trace_ledger.jsonl

      - name: Propose recorded experience
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.experience.outputs.branch }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            ${{ steps.experience.outputs.path }}
            trace_ledger.jsonl
          commit-message: "Register ExperienceEvent for Issue #${{ steps.experience.outputs.issue_number }}"
          title: "Register ExperienceEvent for Issue #${{ steps.experience.outputs.issue_number }}"
          body: |
            Records an Issue revision in wounds/unresolved/ and trace_ledger.jsonl.
            Source: #${{ steps.experience.outputs.issue_number }}

            This observation remains unassimilated. Keyword matches are review
            candidates and do not authorize implementing or closing the Issue.
            The standing ingestion decision is in rituals/decision_rite.md.
            Tests and the five-axis gate ran before publication.
            Review the source snapshot, retained text, and classification before merge.
            This PR does not resolve contradiction; it records material for review.
