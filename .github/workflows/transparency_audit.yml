name: Transparency Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transparency:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit trace ledger and bias manifest
        run: python agents/transparent_deconstructor.py

      - name: Tensorize available transparency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-transparency-report
          path: .ctr/
