name: Self Rewrite

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Create a pull request with regenerated SELF.md"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  self-rewrite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate SELF.md
        run: python kernel/self_state.py --write

      - name: Run tensor gate
        run: python kernel/tensor_gate.py --all --enforce

      - name: Upload rewritten self-state
        uses: actions/upload-artifact@v4
        with:
          name: ctr-self-rewrite
          path: |
            SELF.md
            .ctr/

      - name: Configure git author
        if: ${{ inputs.open_pr == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Open SELF rewrite PR
        if: ${{ inputs.open_pr == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B self/rewrite
          git add SELF.md
          if git diff --cached --quiet; then
            echo "No SELF.md changes to publish."
            exit 0
          fi
          git commit -m "Regenerate SELF state"
          git push -u origin self/rewrite
          gh pr create --title "Regenerate SELF state" --body "Generated by CTR self rewrite workflow after tensor gate validation."
