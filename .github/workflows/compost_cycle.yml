name: Compost Cycle

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Move expired artifacts to compost in the workflow workspace"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  compost:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect decaying artifacts
        run: python kernel/compost_engine.py scan

      - name: Move artifacts to compost
        env:
          CTR_APPLY_COMPOST: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes == true && '1' || '0' }}
        run: python kernel/compost_engine.py move

      - name: Update relation graph audit
        run: python agents/fudo_compiler.py update-compost

      - name: Run null audit after compost
        run: python agents/null_auditor.py audit-compost

      - name: Upload compost plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-compost-cycle
          path: .ctr/
